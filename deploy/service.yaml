# Cloud Run service for the Aegis hosted demo. Replace PROJECT_ID, REGION and TAG, then:
#   gcloud run services replace deploy/service.yaml --region REGION
# Safe by default: stub providers, models off, one instance, ephemeral storage, no secrets.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aegis-demo
  labels:
    app: aegis
    purpose: hosted-demo
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: aegis-demo-run@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/aegis/aegis-demo:TAG
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: AEGIS_ENV
              value: cloud
            - name: AEGIS_STORAGE_MODE
              value: sqlite-ephemeral-demo
            - name: AEGIS_PROVIDER_MODE
              value: stub
            - name: AEGIS_MODELS_ENABLED
              value: "false"
            # Public Assist (AEG-PLN-003): served only as a private PREVIEW with an "under review" banner until the release record approves the exact content.
            # Live public feeds and bulletins (no key, no paid call). They run on timers inside the instance, so they only tick while an instance is warm
            # (see docs/99-inbox/O0003 section 6 for the always-on decision). The Google air/weather refresh stays OFF: it is billed and needs the owner's go-ahead.
            - name: AEGIS_LIVE_FEEDS
              value: "true"
            - name: AEGIS_BROADCAST
              value: "true"
            - name: AEGIS_ENV_REFRESH
              value: "false"
            - name: AEGIS_ASSIST_ENABLED
              value: "true"
            - name: AEGIS_ASSIST_PREVIEW
              value: "true"
          startupProbe:
            httpGet:
              path: /api/health
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /api/health
            periodSeconds: 30
